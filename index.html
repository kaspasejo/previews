<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Previews</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0d1117; color: #e6edf3; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 40px 20px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  p.sub { color: #8b949e; margin-top: 6px; font-size: 15px; }
  ul { list-style: none; margin-top: 28px; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
  li + li { border-top: 1px solid #30363d; }
  a {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; color: #e6edf3; text-decoration: none; font-size: 15px;
  }
  a:hover { background: #161b22; }
  a span.path { color: #8b949e; font-size: 13px; font-family: ui-monospace, monospace; }
  .empty { padding: 22px 18px; color: #8b949e; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Previews</h1>
  <p class="sub">Static HTML previews, one folder per preview.</p>
  <ul>
    <li class="empty">No previews published yet.</li>
  </ul>
</main>
</body>
</html>
